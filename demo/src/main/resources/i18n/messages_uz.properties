badge.course.master.definition=Kursni mukammal o‘zlashtirgani va yuqori bilim darajasi uchun beriladi.
badge.fast.learner.definition=Tez o‘rganishi va yangi mavzularni muvaffaqiyatli o‘zlashtirgani uchun beriladi.
badge.deans.list.definition=A’lo akademik natijalari va Dekan ro‘yxatiga kiritilgani uchun beriladi.
badge.bookworm.definition=Kitob o‘qishga bo‘lgan qiziqishi va faol mutolaasi uchun beriladi.
badge.perfect.attendance.definition=Barcha darslarga qoldirmasdan qatnashgani uchun beriladi.
badge.community.star.definition=Jamiyatda faol ishtiroki va foydali hissasi uchun beriladi.