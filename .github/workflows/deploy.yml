name: Build and Deploy to AWS

on:
  push:
    branches:
      - Management

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        working-directory: demo
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Upload file to AWS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "demo/build/libs/*.jar"
          target: "/home/${{ secrets.SERVER_USER }}/app/"
          strip_components: 3

      - name: Restart app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/app/
      
            echo "Stopping old app..."
            if pgrep -f "java -jar" > /dev/null; then
              pkill -f "java -jar"
              sleep 2
            fi
      
            echo "Finding latest jar..."
            JAR=$(ls -t demo-*.jar | grep -v plain | head -n 1)
      
            echo "Starting $JAR"
            nohup java -jar "$JAR" > app.log 2>&1 < /dev/null &
            disown
      
            echo "Deploy finished"


