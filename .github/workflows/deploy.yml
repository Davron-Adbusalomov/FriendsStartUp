name: Build and Deploy to AWS

on:
  push:
    branches:
      - Management

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR
        working-directory: demo
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Upload file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "demo/build/libs/*.jar"
          target: "/opt/apps/intellecta/"
          strip_components: 3

      - name: Restart app
        uses: appleboy/ssh-action@v1.2.0
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: YOUTUBE_CLIENT_ID,YOUTUBE_CLIENT_SECRET,YOUTUBE_REFRESH_TOKEN
          script: |
            cd /opt/apps/intellecta
      
            pkill -f "demo-.*\.jar" || true
      
            JAR=$(ls demo-*.jar | grep -v plain | head -n 1)
      
            nohup java \
              -DYOUTUBE_CLIENT_ID="$YOUTUBE_CLIENT_ID" \
              -DYOUTUBE_CLIENT_SECRET="$YOUTUBE_CLIENT_SECRET" \
              -DYOUTUBE_REFRESH_TOKEN="$YOUTUBE_REFRESH_TOKEN" \
              -jar "$JAR" > app.log 2>&1 < /dev/null &
