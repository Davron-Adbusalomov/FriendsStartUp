name: Build and Deploy to AWS

on:
  push:
    branches:
      - management

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout your repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up JDK (you can use 17 or your version)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ Build the JAR
      - name: Build JAR
        run: ./gradlew clean build -x test

      # 4️⃣ Copy built JAR to AWS server via SSH
      - name: Deploy to AWS
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"

      # 5️⃣ Restart app on AWS
      - name: Restart Application
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/app
            pkill -f "myapp.jar" || true
            nohup java -jar build/libs/myapp.jar > app.log 2>&1 &
