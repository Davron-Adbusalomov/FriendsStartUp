name: Gradle CI/CD

on:
  push:
    branches: [ "management" ]
  pull_request:
    branches: [ "management" ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Rename JAR
        run: mv build/libs/*.jar build/libs/eco_pharm_desktop.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/eco_pharm_desktop.jar

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/management'

    steps:
      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "eco_pharm_desktop.jar"
          target: "/home/${{ secrets.SERVER_USER }}/app/"

      - name: Restart application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Restarting app..."
            pkill -f 'eco_pharm_desktop.jar' || true
            nohup java -jar /home/${{ secrets.SERVER_USER }}/app/eco_pharm_desktop.jar > /home/${{ secrets.SERVER_USER }}/app/app.log 2>&1 &
            echo "✅ Deployed and started eco_pharm_desktop.jar!"
