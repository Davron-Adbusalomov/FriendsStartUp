name: Build and Deploy

on:
  push:
    branches: [ "management" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle (inside demo)
        working-directory: demo
        run: chmod +x gradlew && ./gradlew clean build -x test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-jar
          path: demo/build/libs/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/management'

    steps:
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: demo-jar

      - name: Copy jar to AWS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "*.jar"
          target: "/home/${{ secrets.SERVER_USER }}/app/"

      - name: Restart app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Restarting app..."
            pkill -f 'demo-0.0.1.jar' || true
            nohup java -jar /home/${{ secrets.SERVER_USER }}/app/demo-0.0.1.jar > /home/${{ secrets.SERVER_USER }}/app/app.log 2>&1 &
            echo "Deployed successfully!"
